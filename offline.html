<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — ePublicLibrary</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #fdfcfb; --fg: #1c1917; --muted: #57534e; --accent: #c2703c;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #0f0e0d; --fg: #fafaf9; --muted: #a8a29e; }
        }
        body {
            margin: 0; min-height: 100vh;
            display: grid; place-items: center;
            background: var(--bg); color: var(--fg);
            font: 16px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            padding: 2rem;
        }
        .card {
            max-width: 480px; text-align: center;
            padding: 2rem;
        }
        h1 {
            font-family: 'Iowan Old Style', Charter, Cambria, serif;
            font-size: 2rem; font-weight: 400; margin: 0 0 0.5rem;
            line-height: 1.2;
        }
        p { color: var(--muted); margin: 0 0 1.5rem; }
        .btn {
            display: inline-block; padding: 0.7rem 1.4rem;
            background: var(--accent); color: white; text-decoration: none;
            border-radius: 8px; font-weight: 600;
        }
        .hint {
            margin-top: 2rem; font-size: 0.875rem; color: var(--muted);
        }
    </style>
</head>
<body>
<main class="card">
    <h1>You're offline</h1>
    <p>This page isn't cached for offline reading. Re-connect, then try
       again. Books you've recently opened may still be available — open
       the library and pick one.</p>
    <a class="btn" href=".">Back to the library</a>
    <p class="hint">If a book is cached, opening it from the library while
       offline will still work.</p>
</main>
</body>
</html>
